app = "florence-api"
primary_region = "jnb"

[build]

[deploy]
  release_command = "node dist/src/db/migrate-cli.js"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  MAIL_DRIVER = "resend"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
