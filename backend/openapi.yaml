openapi: 3.1.0
info:
  title: Florence API
  version: 0.3.0
  summary: Backend for the Florence PWA, shared with the Telegram and WhatsApp bots.
  description: |
    Contract for the Florence chat client (exam prep first). Frozen for the build at 0.3.0. Changes
    land here first, then in code.

    Leaderboard and Wrapped are skeletons in this version. Their routes answer with valid shapes
    and build no ranking or recap: the board stays `not_open`, weekly results are an empty list,
    and Wrapped answers 409 `wrapped_not_ready`.

    Conventions
    - Errors are RFC 9457 `application/problem+json` with a stable `code`.
    - Lists use opaque cursors.
    - Anything that spends tokens is charged on start and refunded exactly once on failure.
      The refund rule is enforced server side; clients only see `refunded: true`.
    - `Idempotency-Key` is required where a retry could double-charge.
    - Authentication endpoints accept an optional bearer token. With one, the proven identity is
      linked to the signed-in account. Without one, it signs in (or creates an account).

    See `docs/data-model.md` for tables, token rules and the merge algorithm.
  contact:
    name: Florence engineering
    email: engineering@florence.example
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.florence.example
    description: Placeholder host. Replace once the domain is chosen.
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Sign in and sign up with Telegram, WhatsApp, email or Google. Also links extra identities when called with a session.
  - name: Account
    description: The signed-in account, its linked identities, student status and notification preferences.
  - name: Tokens
    description: Balance, ledger and top-ups.
  - name: Chat
    description: Conversations and streamed replies from Florence.
  - name: Home
    description: The Home screen and the Fact of the Day.
  - name: Study
    description: Study sessions in four modes (quiz, flashcards, fill in the blank, mock exam), answers and results.
  - name: Progress
    description: Overview and mastery per course.
  - name: Streak
    description: Study days, streak and the freeze. Server side, Africa/Lagos time.
  - name: Leaderboard
    description: Opt-in weekly boards per course and per campus.
  - name: Wrapped
    description: Monthly and yearly recaps with share images.
  - name: Profile
    description: School, department, level, exam date and courses.
  - name: Guest
    description: Three free questions from the website before sign-up.
  - name: Library
    description: Files the student saved for reuse in chat and prep.
  - name: Push
    description: Web Push subscriptions.
  - name: Internal
    description: Called by the Telegram and WhatsApp bots only. Not for browsers.
  - name: System
    description: Health.

security:
  - bearerAuth: []

paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness check
      description: Returns 200 when the process can serve requests. Does not touch the database.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- Auth
  /v1/auth/telegram/oidc:
    post:
      tags: [Auth]
      operationId: signInWithTelegramOidc
      summary: Finish Log in with Telegram (Login Widget or OIDC code flow)
      description: |
        Accepts one of two proofs.

        Login Widget: the browser sends the fields the Telegram Login Widget returned, unchanged.
        The API checks `hash` as HMAC-SHA256 of the sorted fields, keyed with SHA-256 of the bot
        token, and refuses an `auth_date` older than 24 hours. This needs only the bot token.

        OIDC: the browser runs the authorization code flow with PKCE (S256) against `oauth.telegram.org`
        using the scopes `openid profile`. It then sends the code here. The API exchanges it using
        the bot's client id and secret (HTTP Basic), verifies the `id_token` against Telegram's
        JWKS (`iss`, `aud` equal to the bot id, `exp`), and keys the identity on the `id` claim,
        which matches the bot's `ctx.from.id`. This needs the OIDC client id and secret, and answers
        503 `channel_unavailable` without them.

        With a bearer token the identity is linked instead of signing in.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramOidcRequest'
            example:
              code: 4f1c9a0e-2b7d-4d8e-9c53-6a1f0d2b7e11
              codeVerifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
              redirectUri: https://app.florence.example/auth/telegram/callback
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/challenges:
    post:
      tags: [Auth]
      operationId: createAuthChallenge
      summary: Start a Telegram deep link or WhatsApp code login
      description: |
        Returns two values. `challengeId` is a secret that only this browser keeps, used to poll
        and redeem. `code` is the short text that travels through the messaging app. Someone who
        sees the code cannot redeem the session.

        For `telegram` the user opens `deepLink` and presses Start. For `whatsapp` the user opens
        `deepLink` (a `wa.me` link with the code prefilled) and sends the message. The bot then
        calls the internal claim endpoint with the sender's verified id.

        `intent: link` requires a bearer token.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
            example:
              channel: whatsapp
              intent: signin
      responses:
        '201':
          description: Challenge created. Valid for 10 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Challenge'
              example:
                challengeId: Zm9vYmFyYmF6cXV4MTIzNDU2Nzg5MGFiY2RlZmdoaWo
                code: FLO-482913
                deepLink: https://wa.me/2348000000000?text=FLO-482913
                expiresAt: '2026-11-10T21:10:00Z'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/challenges/{challengeId}:
    get:
      tags: [Auth]
      operationId: getAuthChallengeStatus
      summary: Poll a challenge
      description: Returns only the status. Poll every 2 seconds. The session is never returned here.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          description: Current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeStatus'
              example:
                status: pending
                expiresAt: '2026-11-10T21:10:00Z'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/challenges/{challengeId}/redeem:
    post:
      tags: [Auth]
      operationId: redeemAuthChallenge
      summary: Exchange a verified challenge for a session
      description: |
        Works once. A second call returns 409 `challenge_already_redeemed`. Returns 409
        `challenge_pending` if the bot has not claimed it yet.

        With a bearer token and a challenge created with `intent: link`, the identity is attached
        to the account and the response still carries a fresh session.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '410':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/email/start:
    post:
      tags: [Auth]
      operationId: startEmailAuth
      summary: Send a 6-digit sign-in code
      description: |
        Always answers 202, whether or not the address has an account, so the endpoint cannot be
        used to list users. Limits: 3 sends per hour per address, 10 per hour per IP.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
            example:
              email: ada@student.unilag.edu.ng
      responses:
        '202':
          description: Accepted. A code is on its way if the address can receive mail.
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmailAuth
      summary: Confirm the 6-digit code
      description: Five wrong attempts lock the code. The user must request a new one.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
            example:
              email: ada@student.unilag.edu.ng
              code: '482913'
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/whatsapp/start:
    post:
      tags: [Auth]
      operationId: startWhatsAppAuth
      summary: Send a 6-digit sign-in code on WhatsApp
      description: |
        Sends the approved authentication template `florence_signin_code` to the number on
        WhatsApp. Nigerian local numbers (`0803 123 4567`) are read as +234. The identity is the
        WhatsApp number, the same id the bot uses, so a student who has chatted with Florence on
        WhatsApp signs in to that account and keeps its history.

        Limits: 3 sends per hour per number, 10 per hour per IP. Answers 422 `invalid_phone` for a
        number that cannot be a phone number, 422 `whatsapp_send_failed` when WhatsApp refuses the
        message (for example, the number has no WhatsApp account), and 503 `channel_unavailable`
        when the WhatsApp Cloud API settings are missing in production.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  minLength: 7
                  maxLength: 24
            example:
              phone: 0803 123 4567
      responses:
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required: [phone, display, resendAfter]
                properties:
                  phone:
                    type: string
                    description: Digits with country code, used for the verify call.
                  display:
                    type: string
                    description: The number as typed back to the student, for "We sent it on WhatsApp to ...".
                  resendAfter:
                    type: integer
                    description: Seconds before another code can be asked for.
              example:
                phone: '2348031234567'
                display: 0803 123 4567
                resendAfter: 30
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/whatsapp/verify:
    post:
      tags: [Auth]
      operationId: verifyWhatsAppAuth
      summary: Confirm the WhatsApp code
      description: Five wrong attempts lock the code. With a bearer token the number is linked instead.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  minLength: 7
                  maxLength: 24
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
            example:
              phone: '2348031234567'
              code: '482913'
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/google:
    post:
      tags: [Auth]
      operationId: signInWithGoogle
      summary: Sign in with a Google ID token
      description: |
        If the token carries an `hd` claim that matches a known institution domain, the caller
        also becomes a verified student with no email round trip.

        Answers 503 `channel_unavailable` until `GOOGLE_CLIENT_ID` is set.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  minLength: 20
            example:
              idToken: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NSJ9.c2ln
      responses:
        '200':
          $ref: '#/components/responses/AuthSession'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/IdentityConflict'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate the refresh cookie and get a new access token
      description: |
        Reads the `flo_rt` cookie. The old refresh token stops working. Presenting an already
        rotated token revokes the whole token family and answers 401 `refresh_reuse_detected`.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token. A new `flo_rt` cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              example:
                accessToken: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiJhY2NfMSJ9.c2ln
                expiresIn: 900
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh token family
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Signed out. The `flo_rt` cookie is cleared.
        default:
          $ref: '#/components/responses/Problem'

  # ------------------------------------------------------------- Account
  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The signed-in account
      responses:
        '200':
          description: The account with its identities, balance and student status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 0b6f2c52-7f1d-4c1e-9d0a-4a3b8f2e9c10
                displayName: Ada
                username: null
                tokenBalance: 24
                identities:
                  - id: 7d9a8c3e-5b21-4f6a-8c0e-1d2b3a4c5d6e
                    provider: telegram
                    display: '@ada_o'
                    verifiedAt: '2026-11-10T20:00:00Z'
                student:
                  status: none
                createdAt: '2026-11-10T20:00:00Z'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Change display name or username
      description: Username is optional and unique. Send `null` to clear it. It is a handle for display, never used to sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 60
                username:
                  type: [string, 'null']
                  pattern: '^[a-z0-9_]{3,24}$'
                timezone:
                  type: string
                  description: IANA timezone, used for reminders.
            example:
              username: ada_o
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 0b6f2c52-7f1d-4c1e-9d0a-4a3b8f2e9c10
                displayName: Ada
                username: ada_o
                tokenBalance: 24
                identities: []
                student:
                  status: none
                createdAt: '2026-11-10T20:00:00Z'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/me/identities/{identityId}:
    delete:
      tags: [Account]
      operationId: unlinkIdentity
      summary: Unlink an identity
      description: |
        Refused with 409 `last_identity` if it is the only one. Unlinking does not touch the
        welcome grant guard, so relinking cannot mint tokens again.
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unlinked.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/me/merge:
    post:
      tags: [Account]
      operationId: mergeAccounts
      summary: Merge another account into this one
      description: |
        `mergeToken` comes from a 409 `identity_belongs_to_other_account` response and is valid
        for 10 minutes. The signed-in account survives. Balances are summed with `merge_in` and
        `merge_out` ledger rows. Conversations, files, transactions, prep sessions and push
        subscriptions move to the survivor. The whole operation is one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mergeToken]
              properties:
                mergeToken:
                  type: string
            example:
              mergeToken: mrg_3QeM8r1sXk
      responses:
        '200':
          description: Merged. Returns the surviving account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                id: 0b6f2c52-7f1d-4c1e-9d0a-4a3b8f2e9c10
                displayName: Ada
                username: null
                tokenBalance: 31
                identities: []
                student:
                  status: none
                createdAt: '2026-11-10T20:00:00Z'
        '401':
          $ref: '#/components/responses/Problem'
        '410':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/me/student/verify/start:
    post:
      tags: [Account]
      operationId: startStudentVerification
      summary: Send a code to a school email address
      description: |
        The domain must belong to a known institution. Unknown domains answer 422
        `unknown_institution` and are queued for manual review. Addresses are canonicalised
        (lowercase, `+tag` stripped). The first successful verification of a canonical address
        grants a one-time `student_bonus` of 10 tokens. A yearly renewal keeps the verified badge
        and grants nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolEmail]
              properties:
                schoolEmail:
                  type: string
                  format: email
                  maxLength: 254
            example:
              schoolEmail: ada@student.unilag.edu.ng
      responses:
        '202':
          description: Accepted.
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/me/student/verify/confirm:
    post:
      tags: [Account]
      operationId: confirmStudentVerification
      summary: Confirm the school email code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schoolEmail, code]
              properties:
                schoolEmail:
                  type: string
                  format: email
                  maxLength: 254
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
            example:
              schoolEmail: ada@student.unilag.edu.ng
              code: '482913'
      responses:
        '200':
          description: Verified. On a first verification the 10 token student bonus is in the ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
              example:
                status: verified
                institution: University of Lagos
                verifiedAt: '2026-11-10T20:30:00Z'
                expiresAt: '2027-11-10T20:30:00Z'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/me/notification-preferences:
    get:
      tags: [Account]
      operationId: getNotificationPreferences
      summary: Where and when Florence nudges you
      responses:
        '200':
          description: Current preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
              example:
                channel: web_push
                dailyReminder: true
                reminderLocalTime: '18:00'
                streakNudges: true
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [Account]
      operationId: setNotificationPreferences
      summary: Replace notification preferences
      description: |
        Choosing `telegram` or `whatsapp` requires a linked identity of that kind (422
        `channel_not_linked` otherwise). WhatsApp messages outside the 24-hour window need an
        approved template and cost money, so default web-only accounts to `web_push`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
            example:
              channel: telegram
              dailyReminder: true
              reminderLocalTime: '07:30'
              streakNudges: false
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
              example:
                channel: telegram
                dailyReminder: true
                reminderLocalTime: '07:30'
                streakNudges: false
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  # -------------------------------------------------------------- Tokens
  /v1/tokens:
    get:
      tags: [Tokens]
      operationId: getTokenBalance
      summary: Current balance
      description: The same number as `tokenBalance` on the account. Cheap enough to poll after a purchase.
      responses:
        '200':
          description: Balance.
          content:
            application/json:
              schema:
                type: object
                required: [balance]
                properties:
                  balance:
                    type: integer
                    minimum: 0
              example:
                balance: 24
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/tokens/ledger:
    get:
      tags: [Tokens]
      operationId: listLedger
      summary: Every grant, charge and refund, newest first
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
