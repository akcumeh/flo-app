  /v1/conversations/{conversationId}/messages:
    get:
      tags: [Chat]
      operationId: listMessages
      summary: Messages in a conversation, oldest first
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  nextCursor:
                    type: [string, 'null']
              example:
                items:
                  - id: 5e2d7a90-1c34-4b8f-a6d2-9f0e1b3c4d58
                    role: user
                    text: Why does protein building slow down later?
                    citations: []
                    charged: 1
                    createdAt: '2026-11-10T20:40:00Z'
                nextCursor: null
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Chat]
      operationId: sendMessage
      summary: Send a message and stream Florence's reply
      description: |
        Responds with `text/event-stream`. A text-only question costs 1 token. A question with any
        `fileIds` (photo, PDF or document) costs 2 tokens, as in the bots. The charge is taken before
        the model call starts. If the stream fails or the client
        disconnects before `message.end`, the charge is refunded once and the `error` event carries
        `refunded: true`. A retry with the same `Idempotency-Key` after a failure charges again.

        Retrieval: the question is ranked against the student's chunks with `ts_rank` and the top 6
        are sent with file names and pages. Files under about 24,000 characters named in `fileIds`
        are sent whole. Image files in `fileIds` also go to the model as images (photo question).
        `voiceFileId` answers 422 `voice_not_available` until a transcription provider exists.

        Events, in order:
        - `message.start`: `{messageId, charged, balance}`
        - `delta`: `{text}`, repeated
        - `citation`: `{fileId, label, page, snippet}`, zero or more
        - `message.end`: `{messageId, balance, grounded}`. `grounded: false` means the answer is not in the student's notes.
        - `: keep-alive` comment lines every 15 seconds.
        - `error`: `{code, refunded, balance}`, instead of `message.end`

        Math arrives inside `delta` text as `$$...$$` blocks for the client to render.

        Replaying a request with the same `Idempotency-Key` returns the stored result as a
        single non-streamed JSON `Message` (200, `application/json`) and does not charge again.
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              text: Why does protein building slow down later?
              fileIds:
                - 8a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      responses:
        '200':
          description: Server-sent event stream, or the stored `Message` on an idempotent replay.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames. See the operation description for event names and payloads.
              example: |
                event: message.start
                data: {"messageId":"5e2d7a90-1c34-4b8f-a6d2-9f0e1b3c4d58","charged":2,"balance":22}

                event: delta
                data: {"text":"Ribosomes need a steady supply of energy."}

                event: message.end
                data: {"messageId":"5e2d7a90-1c34-4b8f-a6d2-9f0e1b3c4d58","balance":22}
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                id: 5e2d7a90-1c34-4b8f-a6d2-9f0e1b3c4d58
                role: assistant
                text: Ribosomes need a steady supply of energy.
                citations: []
                charged: 2
                createdAt: '2026-11-10T20:41:00Z'
        '401':
          $ref: '#/components/responses/Problem'
        '402':
          $ref: '#/components/responses/InsufficientTokens'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  # ------------------------------------------------------------ Study sessions
  /v1/sessions:
    get:
      tags: [Study]
      operationId: listSessions
      summary: Past and open sessions, newest first
      description: Feeds Session history (E04). Filter by mode or status.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: mode
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StudyMode'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, completed]
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  nextCursor:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Study]
      operationId: createSession
      summary: Start a study session from library material
      description: |
        Answers 202 with `status: generating`. Poll the session until it is `active`. One open
        session per account: starting another closes the first.

        A session costs 1 token whatever its length, charged here, at start, with the ledger key
        `session:<id>`. A balance of 0 answers 402. The token is refunded once, through the
        ledger, if generation fails or the student leaves with zero answers.

        A session needs at least 2 items. `409 not_enough_material` when the material cannot
        yield 2, and nothing is charged. If generation later produces fewer than 2, the session
        ends as `failed` and the token is refunded. `422 mode_not_possible` when the material cannot support
        the mode (screen M14), for example flashcards from a file with no readable text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            example:
              mode: quiz
              fileIds:
                - 8a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
              questionCount: 10
      responses:
        '202':
          description: Accepted. 1 token charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '402':
          $ref: '#/components/responses/InsufficientTokens'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}:
    get:
      tags: [Study]
      operationId: getSession
      summary: Session state
      description: |
        Items never include the correct answer. It arrives with each verdict. Flashcard items carry
        their `back` text because the student flips the card themselves.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Study]
      operationId: exitSession
      summary: Leave a session early
      description: |
        Releases any files held for the session. Answers already given stay counted for the study
        day. Leaving with zero answers refunds the session's 1 token, once.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Session closed.
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/mode:
    patch:
      tags: [Study]
      operationId: switchSessionMode
      summary: Switch study mode mid-session
      description: |
        Keeps the same material and the answers already given. Remaining items are rebuilt in the
        new mode. Switching charges nothing. Screen M03. `422 mode_not_possible` as on create.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  $ref: '#/components/schemas/StudyMode'
            example:
              mode: flashcards
      responses:
        '200':
          description: The session in its new mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/answers:
    post:
      tags: [Study]
      operationId: submitAnswer
      summary: Answer one item and get the verdict
      description: |
        Send `answer` for text, choice and fill-the-gap items, or `outcome` for flashcards. Send
        `dontKnow: true` for the "I don't know" path (C21). Theory answers are marked by the model
        and can take a few seconds (C17).

        Offline use: `answeredAt` is when the student actually answered. The server counts the
        answer for the Lagos day it was answered, if it arrives within 48 hours. Older answers get
        `422 answer_too_old`. An `answeredAt` in the future is replaced by server time. Streak and
        leaderboard maths always use server time for everything else.

        A retry with the same `Idempotency-Key` returns the stored verdict.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerRequest'
            example:
              itemId: 2
              answer: ATP production through cellular respiration
              answeredAt: '2026-11-11T09:15:00Z'
      responses:
        '200':
          description: Verdict with explanations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verdict'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/complete:
    post:
      tags: [Study]
      operationId: completeSession
      summary: Finish the session
      description: |
        Charges nothing: the session's 1 token was charged at start. A session of at least 2
        items with every item answered makes today a study day. The result carries the streak
        effect. A second call returns the same result.

        When the session lifts the streak to a multiple of 7, `streakReward` carries the +10 tokens
        already written to the ledger.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/mistakes:
    get:
      tags: [Study]
      operationId: listMistakes
      summary: Items the student got wrong or skipped
      description: Review mistakes, screen C26. Includes the stored verdict for each.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The mistakes.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [item, yourAnswer, verdict]
                      properties:
                        item:
                          $ref: '#/components/schemas/SessionItem'
                        yourAnswer:
                          type: [string, 'null']
                        verdict:
                          $ref: '#/components/schemas/Verdict'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/retry:
    post:
      tags: [Study]
      operationId: retryWrongItems
      summary: Start a new session from the items missed here
      description: |
        Retry wrong questions, screen C27. Same mode unless the student picks another. The retry is
        a new session and costs 1 token at start, refunded on the same rules as `createSession`.
        `409 not_enough_material` when fewer than 2 items were missed.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  $ref: '#/components/schemas/StudyMode'
      responses:
        '202':
          description: The new session. 1 token charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Problem'
        '402':
          $ref: '#/components/responses/InsufficientTokens'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/sessions/{sessionId}/share-image:
    get:
      tags: [Study]
      operationId: getSessionShareImage
