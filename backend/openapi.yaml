      operationId: createPushSubscription
      summary: Register a browser for Web Push
      description: |
        Call this from a tap, after the user grants permission. On iOS the PWA must already be
        installed to the Home Screen (iOS 16.4 or later). Re-posting the same `endpoint` updates
        the existing row.
      requestBody:
