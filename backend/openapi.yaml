  /v1/files:
    get:
      tags: [Library]
      operationId: listFiles
      summary: Saved files
      responses:
        '200':
          description: All saved files, at most 20.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/StoredFile'
              example:
                items:
                  - id: 8a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                    name: BIO 102 - Cell biology notes.pdf
                    mimeType: application/pdf
                    sizeBytes: 1843200
                    kind: document
                    createdAt: '2026-11-10T20:10:00Z'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Library]
      operationId: uploadFile
      summary: Save a file
      description: |
        A PDF, a voice note, or one or more page images, at most 20 MB in total (the limit the Telegram path already enforces). Several page images from the camera (C04) become one material. Saving is free. Reading the material continues in the background: poll `getFile` until `status` is `ready` (C05 to C07) or `failed` (C08).
        A name that already exists gets `-2` appended. The 21st file answers 409 `library_full`.
        Files are mirrored to the model provider lazily, on first use in chat or prep.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pages]
              properties:
                pages:
                  description: One file, or the field repeated once per page photo (up to 30).
                  oneOf:
                    - type: string
                      format: binary
                    - type: array
                      minItems: 1
                      maxItems: 30
                      items:
                        type: string
                        format: binary
                courseId:
                  type: string
                  description: Attach the material to a course.
                name:
                  type: string
                  maxLength: 120
                  description: Optional display name. Defaults to the uploaded filename.
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
              example:
                id: 8a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                name: BIO 102 - Cell biology notes.pdf
                mimeType: application/pdf
                sizeBytes: 1843200
                kind: document
                createdAt: '2026-11-10T20:10:00Z'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/files/{fileId}:
    get:
      tags: [Library]
      operationId: getFile
      summary: One material with its reading status and topics
      description: Screens C05 to C08 and C10.
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: The material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Library]
