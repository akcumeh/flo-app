  /v1/guest/messages:
    post:
      tags: [Guest]
      operationId: sendGuestMessage
      summary: Ask a question as a guest and stream the answer
      description: |
        Same event stream as `sendMessage`. After the third answer, `message.end` carries
        `questionsLeft: 0` and the client shows the save prompt (A03). A fourth question answers
        429 `guest_limit_reached`. Guests are never charged tokens.
      security:
        - guestToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 2000
            example:
              text: Why does protein building slow down later?
      responses:
        '200':
          description: Server-sent event stream. Event names match `sendMessage`.
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'

  /v1/guest/claim:
    post:
      tags: [Guest]
      operationId: claimGuestChat
      summary: Keep the guest chat after signing up
      description: Called right after sign-in from the save prompt (A03). Moves the guest messages into a conversation on the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
