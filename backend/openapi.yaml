  /v1/facts/today:
    get:
      tags: [Home]
      operationId: getFactOfTheDay
      summary: Today's Fact of the Day
      description: Screen B05. The hidden-message mechanic is a client concern. This returns the text.
      responses:
        '200':
          description: The fact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fact'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- Streak
  /v1/streak:
    get:
      tags: [Streak]
      operationId: getStreak
      summary: Streak, today's progress and the month calendar
      description: |
        All maths is server side, in Africa/Lagos (00:00 to 23:59), on server time. Client clocks
        are ignored.

        - A study day needs either 3 items that day or one finished session. Items are prep
          questions answered, flashcards rated and Ask questions asked, in the app or in the bots.
          A finished session has at least 2 items, every one answered.
        - Offline answers count for the day they were answered if they sync within 48 hours.
        - The streak counts consecutive study days.
        - The 6th study day of a run grants one freeze if none is held, and the run counter
          restarts at 0. At most 1 freeze is held.
        - A missed day uses a held freeze automatically at midnight. The streak keeps its value and
          the day shows as `frozen`.
        - A missed day with no freeze, or a second missed day in a row, sets the streak to 0. The
          longest streak never decreases.
        - The pill shows `at_risk` from 18:00 if today is not yet a study day.
        - Each time the streak reaches a multiple of 7, a `streak_reward` of 10 tokens is written
          to the ledger with the key `streak7:<account>:<study_day>`.
      parameters:
        - name: month
          in: query
          required: false
          description: Calendar month to return, `YYYY-MM`. Defaults to the current month.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      responses:
        '200':
          description: Streak state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Streak'
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- Leaderboard
  /v1/leaderboard:
    get:
      tags: [Leaderboard]
      operationId: getLeaderboard
      summary: This week's board for a course or campus
      description: |
        Score is study days this week (0 to 7), Monday 00:00 to Sunday 23:59 WAT. Ties go to
        whoever reached the total first. Volume never counts.

        A board opens at 5 opted-in students (`status: not_open`, screen L07). Students who are
        opted out get their private rank in `you` and are never listed in `entries`.

        Skeleton in 0.3.0: every board answers `status: not_open` with empty `entries` and a null
        `you.rank`. No ranking is computed yet.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [course, campus]
        - name: courseId
          in: query
          required: false
          description: Required when `scope` is `course`.
          schema:
            type: string
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leaderboard'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/leaderboard/optin:
    put:
      tags: [Leaderboard]
      operationId: setLeaderboardOptIn
      summary: Join or leave the leaderboards
      description: |
        Default is off. The shown name is a display name of 2 to 20 characters, checked against a
        blocklist. A name that matches the blocklist answers 422 `display_name_rejected` and is not
        stored. The flag and name are stored in 0.3.0 even though boards are not built yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optedIn]
              properties:
                optedIn:
                  type: boolean
                displayName:
                  type: string
                  minLength: 2
                  maxLength: 20
            example:
              optedIn: true
              displayName: Ada O
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [optedIn, displayName]
                properties:
                  optedIn:
                    type: boolean
                  displayName:
                    type: [string, 'null']
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /v1/leaderboard/weekly-results:
    get:
      tags: [Leaderboard]
      operationId: getWeeklyResults
      summary: Last week's results
      description: |
        Screen L06, shown on Monday. One entry per board the student was on for the week that just
        ended. Skeleton in 0.3.0: always an empty list.
      responses:
        '200':
          description: Results for the week that just ended.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WeeklyResult'
              example:
                items: []
        '401':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  # ---------------------------------------------------------------- Wrapped
  /v1/wrapped:
    get:
      tags: [Wrapped]
      operationId: getWrapped
      summary: Florence Wrapped for a month or a year
      description: |
        Monthly recaps are generated on the 1st for the previous month, yearly on 31 Dec. A period
        needs 5 study days. A topic is only named strongest or weakest with at least 10 answers
        behind it. Ask questions asked through the bots count.

        When a recap is not ready the call answers 409 `wrapped_not_ready` (screen W11). Skeleton
        in 0.3.0: no recap is built, so every period answers 409.
      parameters:
        - name: period
          in: query
          required: true
          description: '`YYYY-MM` for a month, `YYYY` for a year.'
          schema:
            type: string
            pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
      responses:
        '200':
          description: The recap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wrapped'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          description: Not ready. Fewer than 5 study days in the period, or recaps are not built yet.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://florence.example/problems/wrapped-not-ready
                title: Wrapped is not ready
                status: 409
                code: wrapped_not_ready
                detail: Wrapped for 2026-10 is not ready yet.
                requestId: req_01JC8Q40
        default:
          $ref: '#/components/responses/Problem'

  /v1/wrapped/share-image:
    get:
      tags: [Wrapped]
      operationId: getWrappedShareImage
      summary: A Wrapped card as a 1080 by 1920 image
      description: |
        For WhatsApp status and Instagram stories. Brand colours are fixed in light and dark so a
        shared image always looks the same. The score stays hidden unless `showScore=true`
        (screen W09). Answers 409 `wrapped_not_ready` on the same rule as `getWrapped`, which in
        0.3.0 means always.
      parameters:
        - name: period
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}(-(0[1-9]|1[0-2]))?$'
        - name: card
          in: query
          required: false
          schema:
            type: string
            enum: [cover, questions, right_wrong, sessions, streak, topics, mode, summary]
            default: summary
        - name: showScore
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The image.
          content:
            image/png:
              schema:
                type: string
                contentEncoding: base64
                contentMediaType: image/png
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

