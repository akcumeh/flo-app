                  maintenance:
                    type: boolean
                  message:
                    type: [string, 'null']
                  minClientVersion:
                    type: string
                  latestClientVersion:
                    type: string
        default:
          $ref: '#/components/responses/Problem'

  # ------------------------------------------------------------ Internal
  /internal/v1/auth/challenges/claim:
    post:
      tags: [Internal]
      operationId: claimAuthChallenge
      summary: Bot reports who sent the challenge code
      description: |
        Called by the Telegram bot's `/start login_<code>` handler (with `ctx.from.id`) and by the
        WhatsApp webhook (with the sender's `wa_id`). The caller has already authenticated the
        platform request: the bots must verify Telegram's secret token header and Meta's
        `X-Hub-Signature-256` before calling this. The API trusts `providerUserId` completely.

        Answers 404 for an unknown or expired code, so bots can reply "that code expired".
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
            example:
              code: FLO-482913
              provider: whatsapp
              providerUserId: '2348012345678'
              displayName: Ada
      responses:
        '200':
          description: Claimed. The browser's next poll sees `verified`.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: verified
              example:
                status: verified
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /internal/v1/events:
    post:
      tags: [Internal]
      operationId: recordBotEvent
      summary: A bot reports a question asked or answered
      description: |
        Every Ask question, every prep answer and every finished prep quiz in the Telegram or
        WhatsApp bot is reported here, so bot activity counts toward study days, the streak and
        Florence Wrapped on the same rules as the app. The identity is resolved to an
        account the same way as sign-in, including importing the legacy balance, so a student who
        has never opened the app still has a streak.

        `eventId` is an idempotency key. A repeat answers 200 with `accepted: false` and changes
        nothing. When the event tips today into a study day and the streak reaches a multiple of 7,
        the 10 token reward is written to the ledger and returned, so the bot can say so.
      security:
        - serviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotEvent'
            example:
              eventId: 5b1d6c7e-3a2f-4d90-8e11-7a6c5b4d3e2f
              provider: telegram
              providerUserId: '123456789'
              type: ask_question
              occurredAt: '2026-11-11T09:15:00Z'
      responses:
        '200':
          description: Recorded, or already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BotEventResult'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /internal/v1/streak:
    get:
      tags: [Internal]
      operationId: getBotStreak
      summary: Streak summary for the bots' /streak command
      description: Replaces the streak stored in the Mongo user document. The bots stop computing streaks themselves.
      security:
        - serviceKey: []
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [telegram, whatsapp]
        - name: providerUserId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'

webhooks:
  paystackCharge:
    post:
      tags: [Tokens]
      operationId: receivePaystackEvent
      summary: Paystack event
      description: |
        Registered in the Paystack dashboard as `POST {api}/v1/webhooks/paystack`. The body signature is HMAC SHA512 of the raw body
        with the secret key, sent in `x-paystack-signature`. On `charge.success` the purchase is
        marked paid and a `purchase` ledger row is written, once, keyed on the reference. Always
        answers 200 fast. Paystack retries on anything else.
      security:
        - paystackSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                event:
                  type: string
                  examples: [charge.success]
                data:
                  type: object
                  required: [reference]
                  properties:
                    reference:
                      type: string
                    status:
                      type: string
            example:
              event: charge.success
              data:
                reference: FLO-PAY-1731270000-8123
                status: success
      responses:
        '200':
          description: Received.
        '401':
          description: Signature mismatch. Nothing is credited.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: flo_rt
      description: Opaque refresh token, 30 days, `httpOnly; Secure; SameSite=Strict`, rotated on every use.
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: Shared secret held by the bots. Rotate independently of user tokens.
    guestToken:
      type: apiKey
      in: header
      name: X-Guest-Token
      description: Issued by `createGuestSession`. Limits a device to 3 free questions.
    paystackSignature:
      type: apiKey
      in: header
      name: x-paystack-signature

  headers:
    SetRefreshCookie:
      description: Sets `flo_rt` (`httpOnly; Secure; SameSite=Strict; Path=/v1/auth`).
      schema:
        type: string
    RetryAfter:
      description: Seconds until the next attempt is allowed.
      schema:
        type: integer
        minimum: 1

  parameters:
    ChallengeId:
      name: challengeId
      in: path
      required: true
      description: The 256-bit secret returned when the challenge was created.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{43}$'
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque value from `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID. A retry with the same key returns the original result.
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID. A retry with the same key never charges twice.
      schema:
        type: string
        format: uuid

  responses:
    Problem:
      description: Error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://florence.example/problems/not-found
            title: Not found
            status: 404
            code: not_found
            detail: No such resource.
            requestId: req_01JC8Q2Z
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://florence.example/problems/rate-limited
            title: Too many requests
            status: 429
            code: rate_limited
            detail: Try again in 60 seconds.
            requestId: req_01JC8Q30
    InsufficientTokens:
      description: Not enough tokens. Nothing was charged.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://florence.example/problems/insufficient-tokens
            title: Not enough tokens
            status: 402
            code: insufficient_tokens
            detail: This needs 2 tokens and the balance is 1.
            requestId: req_01JC8Q31
    IdentityConflict:
      description: |
        The proven identity already belongs to another account (`identity_belongs_to_other_account`,
        with a `mergeToken`), or a challenge state conflict (`challenge_pending`,
        `challenge_already_redeemed`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MergeConflict'
          example:
            type: https://florence.example/problems/identity-belongs-to-other-account
            title: Identity belongs to another account
            status: 409
            code: identity_belongs_to_other_account
            detail: This Telegram account is already linked elsewhere.
            requestId: req_01JC8Q32
            mergeToken: mrg_3QeM8r1sXk
            mergeTokenExpiresAt: '2026-11-10T20:50:00Z'
    AuthSession:
      description: Signed in. A `flo_rt` refresh cookie is set.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/SetRefreshCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthSession'
          example:
            accessToken: eyJhbGciOiJFUzI1NiJ9.eyJzdWIiOiJhY2NfMSJ9.c2ln
            expiresIn: 900
            isNewAccount: true
            welcomeGrant:
              granted: true
              tokens: 10
            account:
              id: 0b6f2c52-7f1d-4c1e-9d0a-4a3b8f2e9c10
              displayName: Ada
              username: null
              tokenBalance: 10
              identities:
                - id: 7d9a8c3e-5b21-4f6a-8c0e-1d2b3a4c5d6e
                  provider: telegram
                  display: '@ada_o'
                  verifiedAt: '2026-11-10T20:00:00Z'
              student:
                status: none
              createdAt: '2026-11-10T20:00:00Z'

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details plus a stable machine `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: |
            Stable, lower_snake_case. Includes `insufficient_tokens`, `rate_limited`,
            `challenge_expired`, `challenge_pending`, `challenge_already_redeemed`,
            `identity_belongs_to_other_account`, `last_identity`, `library_full`,
            `unknown_institution`, `channel_not_linked`, `refresh_reuse_detected`, `not_found`,
            `mode_not_possible`, `not_enough_material`, `answer_too_old`, `display_name_rejected`,
            `guest_limit_reached`, `wrapped_not_ready`, `channel_unavailable`, `invalid_id_token`,
            `invalid_telegram_auth`, `merge_token_expired`, `disposable_email`, `email_in_use`,
            `school_required`, `unknown_department`, `invalid_course_code`, `already_enrolled`,
            `course_not_enrolled`, `file_too_large`, `unsupported_type`, `storage_unavailable`,
            `session_not_active`, `already_answered`, `invalid_answer`, `generation_failed`,
            `course_required`, `request_in_progress`, `file_not_ready`, `voice_not_available`,
            `empty_message`, `invalid_guest_token`, `email_required`, `payments_unavailable`,
            `invalid_signature`, `invalid_subscription`, `invalid_referral`, `referral_too_late`,
            `event_too_old`, `invalid_phone`, `whatsapp_send_failed`, `invalid_code`, `code_locked`.
        detail:
          type: string
        requestId:
          type: string
    MergeConflict:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            mergeToken:
              type: string
              description: Present only for `identity_belongs_to_other_account`.
            mergeTokenExpiresAt:
              type: string
              format: date-time

    TelegramOidcRequest:
      oneOf:
        - $ref: '#/components/schemas/TelegramOidcCode'
        - $ref: '#/components/schemas/TelegramWidgetAuth'
    TelegramWidgetAuth:
      type: object
      required: [id, first_name, auth_date, hash]
      additionalProperties: false
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        photo_url:
          type: string
        auth_date:
          type: integer
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    TelegramOidcCode:
      type: object
      required: [code, codeVerifier, redirectUri]
      additionalProperties: false
      properties:
        code:
          type: string
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
        redirectUri:
          type: string
          format: uri
          description: Must be registered under Allowed URLs in BotFather and match the authorization request.

    ChallengeRequest:
      type: object
      required: [channel]
      properties:
        channel:
          type: string
          enum: [telegram, whatsapp]
        intent:
          type: string
          enum: [signin, link]
          default: signin
    Challenge:
      type: object
      required: [challengeId, code, deepLink, expiresAt]
      properties:
        challengeId:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        code:
          type: string
          pattern: '^FLO-[0-9]{6}$'
        deepLink:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    ChallengeStatus:
      type: object
      required: [status, expiresAt]
      properties:
        status:
          type: string
          enum: [pending, verified, redeemed, expired]
        expiresAt:
          type: string
          format: date-time

    AccessToken:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Seconds.
          examples: [900]
    AuthSession:
      allOf:
        - $ref: '#/components/schemas/AccessToken'
        - type: object
          required: [account, isNewAccount, welcomeGrant]
          properties:
            account:
              $ref: '#/components/schemas/Account'
            isNewAccount:
              type: boolean
            welcomeGrant:
              type: object
              description: 'Granted once per account. `granted` is false on every later sign-in.'
              required: [granted, tokens]
              properties:
                granted:
                  type: boolean
                tokens:
                  type: integer
                  minimum: 0

    Account:
      type: object
      required: [id, displayName, username, tokenBalance, identities, student, createdAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        username:
          type: [string, 'null']
        tokenBalance:
          type: integer
          minimum: 0
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        student:
          $ref: '#/components/schemas/Student'
        profile:
          $ref: '#/components/schemas/Profile'
        createdAt:
          type: string
          format: date-time
    Identity:
      type: object
      required: [id, provider, display, verifiedAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [telegram, whatsapp, email, google]
        display:
          type: string
          description: Safe to show. A handle, or a masked phone or email.
        verifiedAt:
          type: string
          format: date-time
    Student:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [none, verified, expired]
        institution:
          type: string
        verifiedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    NotificationPreferences:
      type: object
      required: [channel, dailyReminder, reminderLocalTime, streakNudges]
      properties:
        channel:
          type: string
          enum: [web_push, telegram, whatsapp, none]
        dailyReminder:
          type: boolean
          description: |
            At most one push a day, only if today is not yet a study day. The copy is in English
            and never mentions loss ("Keep it going", not "You'll lose").
        reminderLocalTime:
          type: string
          description: Africa/Lagos time. Default 20:00. Selectable from 06:00 to 22:00.
          default: '20:00'
          pattern: '^((0[6-9]|1[0-9]|2[01]):[0-5][0-9]|22:00)$'
        streakNudges:
          type: boolean
        leaderboardUpdates:
          type: boolean
        weeklyResults:
          type: boolean

    LedgerEntry:
      type: object
      required: [id, delta, reason, balanceAfter, createdAt]
      properties:
        id:
          type: integer
        delta:
          type: integer
        reason:
          type: string
          enum:
            - welcome_grant
            - student_bonus
            - streak_reward
            - purchase
            - chat_charge
            - prep_charge
            - create_charge
            - refund
            - referral_reward
            - merge_in
            - merge_out
            - legacy_import
            - admin_adjust
        balanceAfter:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    LedgerPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        nextCursor:
          type: [string, 'null']
    Bundle:
      type: object
      required: [id, amountNaira, tokens]
      properties:
        id:
          type: string
        amountNaira:
          type: integer
          minimum: 1
        tokens:
          type: integer
          minimum: 1
    Purchase:
      type: object
      required: [reference, status]
      properties:
        reference:
          type: string
        status:
          type: string
          enum: [pending, awaiting_transfer, success, failed, expired]
        authorizationUrl:
          type: string
          format: uri
        transfer:
          type: object
          description: Present for bank transfers while `status` is `awaiting_transfer` (screen F07).
          required: [bankName, accountNumber, accountName, expiresAt]
          properties:
            bankName:
              type: string
            accountNumber:
              type: string
            accountName:
              type: string
            expiresAt:
              type: string
              format: date-time

    Conversation:
      type: object
      required: [id, title, mode, lastMessageAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: [string, 'null']
        mode:
          type: string
          enum: [ask, prep]
        lastMessageAt:
          type: [string, 'null']
          format: date-time
    SendMessageRequest:
      type: object
      anyOf:
        - required: [text]
        - required: [voiceFileId]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 8000
        voiceFileId:
          type: string
          format: uuid
          description: An uploaded voice note (D11). It is transcribed and answered as text.
        context:
          type: object
          description: Set when asking about a question from a session (C23).
          required: [sessionId, itemId]
          properties:
            sessionId:
              type: string
              format: uuid
            itemId:
              type: integer
              minimum: 0
        fileIds:
          type: array
          maxItems: 5
          items:
            type: string
            format: uuid
    Citation:
      type: object
      required: [fileId, label]
      properties:
        fileId:
          type: string
          format: uuid
        label:
          type: string
        page:
          type: integer
          minimum: 1
        snippet:
          type: string
    Message:
      type: object
      required: [id, role, text, citations, charged, createdAt]
      properties:
        grounded:
          type: boolean
          default: true
          description: False when the answer could not be found in the student's notes (screen D10).
        saved:
          type: boolean
          default: false
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        text:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        charged:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time

    StudyMode:
      type: string
      enum: [quiz, flashcards, fill_blank, mock_exam]
    CreateSessionRequest:
      type: object
      required: [mode, fileIds]
      properties:
        mode:
          $ref: '#/components/schemas/StudyMode'
        fileIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uuid
        topicIds:
          type: array
          description: Limit the session to these topics found in the material.
          items:
            type: string
        questionCount:
          type: integer
          minimum: 2
          maximum: 30
          default: 10
        timeLimitMinutes:
          type: integer
          minimum: 5
          maximum: 240
          description: Mock exam only.
    ItemType:
      type: string
      enum: [mcq, true_false, fill_gap, short, theory, calculation, flashcard]
    ItemState:
      type: string
      enum: [unanswered, right, not_quite, partly, skipped]
    SessionItem:
      type: object
      description: One question or card. Never carries the correct answer, except `back` on flashcards.
      required: [id, type, prompt, marks, difficulty, topic, sourceLabel, state]
      properties:
        id:
          type: integer
          minimum: 0
          description: Index in the session.
        type:
          $ref: '#/components/schemas/ItemType'
        prompt:
          type: string
        options:
          type: array
          description: Present for `mcq`.
          items:
            type: string
        back:
          type: string
          description: Present for `flashcard` only.
        marks:
          type: integer
          minimum: 1
        difficulty:
          type: string
          enum: [easy, medium, hard]
        topic:
          type: string
        sourceLabel:
          type: string
        state:
          $ref: '#/components/schemas/ItemState'
    Session:
      type: object
      required: [id, mode, status, requestedCount, generatedCount, currentIndex, items, cost, refunded, switchableModes, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/StudyMode'
        status:
          type: string
          description: '`failed` when generation failed or yielded fewer than 2 items. The token is refunded.'
          enum: [generating, active, completed, failed, expired]
        fileIds:
          type: array
          items:
            type: string
            format: uuid
        requestedCount:
          type: integer
        generatedCount:
          type: integer
        currentIndex:
          type: integer
          minimum: 0
        round:
          type: integer
          minimum: 1
          description: Flashcards repeat missed cards in rounds (M07).
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionItem'
        switchableModes:
          type: array
          description: Modes this material supports, for the switch sheet (M03).
          items:
            $ref: '#/components/schemas/StudyMode'
        cost:
          type: integer
          const: 1
          description: Tokens charged when the session started, whatever its length.
        refunded:
          type: boolean
          description: True once the start charge has been refunded. Happens at most once.
        timeLimitSeconds:
          type: integer
          description: Mock exam only.
        expiresAt:
          type: string
          format: date-time
    AnswerRequest:
      type: object
      required: [itemId, answeredAt]
      properties:
        itemId:
          type: integer
          minimum: 0
        answeredAt:
          type: string
          format: date-time
        answer:
          type: string
          maxLength: 4000
        outcome:
          type: string
          enum: [know, missed]
          description: Flashcards.
        dontKnow:
          type: boolean
      anyOf:
        - required: [answer]
        - required: [outcome]
        - required: [dontKnow]
    Verdict:
      type: object
      required: [itemId, result, awardedMarks, maxMarks, correctAnswer]
      properties:
        itemId:
          type: integer
        result:
          type: string
          enum: [right, not_quite, partly, skipped]
        awardedMarks:
          type: integer
          minimum: 0
        maxMarks:
          type: integer
          minimum: 1
        correctAnswer:
          type: string
        whyRight:
          type: string
        whyOthersFail:
          type: array
          items:
            type: object
            required: [option, reason]
            properties:
              option:
                type: string
              reason:
                type: string
        examTip:
          type: string
        source:
          $ref: '#/components/schemas/Citation'
        studyDay:
          $ref: '#/components/schemas/StudyDayEffect'
    StudyDayEffect:
      type: object
      description: Whether this call made today a study day.
      required: [counted, streak]
      properties:
        counted:
          type: boolean
          description: True once today is a study day, on the call that made it so and after.
        justEarned:
          type: boolean
          description: True only on the call that tipped today into a study day.
        streak:
          type: integer
          minimum: 0
    SessionResult:
      type: object
      required: [id, sessionId, mode, score, total, failedTopics, sourceDocs, charged, balance, studyDay, createdAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/StudyMode'
        score:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        failedTopics:
          type: array
          items:
            type: string
        sourceDocs:
          type: array
          items:
            type: string
        charged:
          type: integer
          minimum: 0
          maximum: 1
          description: Tokens this session cost in the end, after any refund. Completion itself charges nothing.
        balance:
          type: integer
          minimum: 0
        studyDay:
          $ref: '#/components/schemas/StudyDayEffect'
        streakReward:
          type: object
          description: Present when this session reached a multiple of 7.
          required: [tokens]
          properties:
            tokens:
              type: integer
              examples: [10]
        createdAt:
          type: string
          format: date-time

    StoredFile:
      type: object
      required: [id, name, mimeType, sizeBytes, kind, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 20971520
        kind:
          type: string
          enum: [image, document, audio]
        status:
          type: string
          enum: [uploading, reading, ready, failed]
          default: ready
          description: Screens C05 to C08. Poll `getFile` until `ready` or `failed`.
        pageCount:
          type: integer
          minimum: 1
        courseId:
          type: [string, 'null']
        topics:
          type: array
          description: Found while reading (C07). Empty until `status` is `ready`.
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
              pages:
                type: string
                examples: ['12-17']
        error:
          type: [string, 'null']
          description: Why reading failed, in words a student can act on.
        createdAt:
          type: string
          format: date-time

    PushSubscriptionRequest:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
            auth:
              type: string

    ClaimRequest:
      type: object
      required: [code, provider, providerUserId]
      properties:
        code:
          type: string
          pattern: '^FLO-[0-9]{6}$'
        provider:
          type: string
          enum: [telegram, whatsapp]
        providerUserId:
          type: string
          description: Telegram numeric id, or the WhatsApp `wa_id` (digits, no plus).
        displayName:
          type: string
          maxLength: 60
        username:
          type: string
          maxLength: 64

    StreakSummary:
      type: object
      required: [current, longest, state, studiedToday]
      properties:
        current:
          type: integer
          minimum: 0
        longest:
          type: integer
          minimum: 0
          description: Never decreases.
        state:
          type: string
          enum: [none, active, at_risk]
        studiedToday:
          type: boolean
    Streak:
      allOf:
        - $ref: '#/components/schemas/StreakSummary'
        - type: object
          required: [todayProgress, freeze, timezone, calendar, rewardProgress]
          properties:
            todayProgress:
              type: object
              required: [items, target, sessionsFinished]
              properties:
                items:
                  type: integer
                  minimum: 0
                  description: Prep questions answered, flashcards rated and Ask questions asked today, app and bots together.
                target:
                  type: integer
                  const: 3
                sessionsFinished:
                  type: integer
                  minimum: 0
                  description: Sessions of at least 2 items, every one answered. One is enough for the day.
            freeze:
              type: object
              required: [held, daysToEarn]
              properties:
                held:
                  type: boolean
                  description: At most one freeze is held.
                daysToEarn:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 6
                  description: Study days left in the current run until a freeze is earned. Null while one is held.
            timezone:
              type: string
              const: Africa/Lagos
            calendar:
              type: array
              items:
                type: object
                required: [date, state]
                properties:
                  date:
                    type: string
                    format: date
                  state:
                    type: string
                    enum: [studied, frozen, missed, today, upcoming]
            rewardProgress:
              type: object
              required: [daysToNextReward, tokens]
              properties:
                daysToNextReward:
                  type: integer
                  minimum: 0
                tokens:
                  type: integer
                  const: 10

    Home:
      type: object
      required: [variant, streak]
      properties:
        variant:
          type: string
          description: Which Home state to draw (B01 today, B02 new user, B03 chats but no notes, B04 exam week).
          enum: [today, new_user, chats_no_notes, exam_week]
        streak:
          $ref: '#/components/schemas/StreakSummary'
        rank:
          type: [object, 'null']
          required: [scope, rank, studyDays]
          properties:
            scope:
              type: string
              enum: [course, campus]
            rank:
              type: integer
              minimum: 1
            studyDays:
              type: integer
              minimum: 0
        wrappedTeaser:
          type: [object, 'null']
          description: In 0.3.0 `ready` is always false.
          required: [period, ready]
          properties:
            period:
              type: string
            ready:
              type: boolean
        exam:
          type: [object, 'null']
          required: [courseId, courseCode, date, daysLeft]
          properties:
            courseId:
              type: string
            courseCode:
              type: string
            date:
              type: string
              format: date
            daysLeft:
              type: integer
        resume:
          type: [object, 'null']
          required: [sessionId, mode, answered, total]
          properties:
            sessionId:
              type: string
              format: uuid
            mode:
              $ref: '#/components/schemas/StudyMode'
            answered:
              type: integer
            total:
              type: integer
    ProgressOverview:
      type: object
      required: [studyDaysLast30, sessions, accuracy, courses]
      properties:
        studyDaysLast30:
          type: integer
          minimum: 0
        sessions:
          type: integer
          minimum: 0
        accuracy:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        courses:
          type: array
          items:
            type: object
            required: [courseId, code, mastery]
            properties:
              courseId:
                type: string
              code:
                type: string
              mastery:
                type: [integer, 'null']
                minimum: 0
                maximum: 100
    CourseMastery:
      type: object
      required: [course, mastery, topics]
      properties:
        course:
          $ref: '#/components/schemas/Course'
        mastery:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicMastery'
    TopicMastery:
      type: object
      required: [id, name, mastery, answered]
      properties:
        id:
          type: string
        name:
          type: string
        mastery:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        answered:
          type: integer
          minimum: 0
    Fact:
      type: object
      required: [id, date, text]
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        text:
          type: string
        topic:
          type: string

    Leaderboard:
      type: object
      required: [scope, status, optedIn, optedInCount, minToOpen, week, entries, you]
      properties:
        scope:
          type: string
          enum: [course, campus]
        courseId:
          type: string
        status:
          type: string
          enum: [open, not_open]
        optedIn:
          type: boolean
        optedInCount:
          type: integer
          minimum: 0
        minToOpen:
          type: integer
          const: 5
        week:
          type: object
          required: [start, end]
          properties:
            start:
              type: string
              format: date
            end:
              type: string
              format: date
        entries:
          type: array
          description: Opted-in students only. Empty while the board is not open.
          items:
            type: object
            required: [rank, displayName, studyDays, isYou]
            properties:
              rank:
                type: integer
                minimum: 1
              displayName:
                type: string
              studyDays:
                type: integer
                minimum: 0
                maximum: 7
              isYou:
                type: boolean
        you:
          type: object
          description: The student's own rank, computed even when opted out.
          required: [rank, studyDays]
          properties:
            rank:
              type: [integer, 'null']
              minimum: 1
            studyDays:
              type: integer
              minimum: 0
              maximum: 7
    WeeklyResult:
      type: object
      required: [weekStart, weekEnd, scope, rank, studyDays, optedIn]
      properties:
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        scope:
          type: string
          enum: [course, campus]
        rank:
          type: [integer, 'null']
          minimum: 1
        studyDays:
          type: integer
          minimum: 0
          maximum: 7
        optedIn:
          type: boolean

    Wrapped:
      type: object
      required: [period, status, studyDaysInPeriod, studyDaysNeeded]
      properties:
        period:
          type: string
        status:
          type: string
          const: ready
          description: A period that is not ready answers 409 `wrapped_not_ready` instead.
        studyDaysInPeriod:
          type: integer
          minimum: 0
        studyDaysNeeded:
          type: integer
          const: 5
        stats:
          $ref: '#/components/schemas/WrappedStats'
    WrappedStats:
      type: object
      required: [questionsAsked, answered, right, notQuite, sessions, practiceMinutes, longestStreak, mostUsedMode]
      properties:
        questionsAsked:
          type: integer
          minimum: 0
          description: Ask questions, from the app and from the bots.
        answered:
          type: integer
          minimum: 0
        right:
          type: integer
          minimum: 0
        notQuite:
          type: integer
          minimum: 0
        sessions:
          type: integer
          minimum: 0
        practiceMinutes:
          type: integer
          minimum: 0
        longestStreak:
          type: integer
          minimum: 0
          description: Longest streak inside the period.
        strongestTopic:
          type: [object, 'null']
          description: Null below 10 answers.
          required: [name, accuracy]
          properties:
            name:
              type: string
            accuracy:
              type: integer
              minimum: 0
              maximum: 100
        weakestTopic:
          type: [object, 'null']
          description: Null below 10 answers.
          required: [name, accuracy]
          properties:
            name:
              type: string
            accuracy:
              type: integer
              minimum: 0
              maximum: 100
        mostUsedMode:
          $ref: '#/components/schemas/StudyMode'

    School:
      type: object
      required: [id, name, country, kind]
      properties:
        id:
          type: string
        name:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2.
        kind:
          type: string
          enum: [university, polytechnic, college_of_education, other]
    Department:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Profile:
      type: object
      required: [school, department, level, examDate, onboardingComplete]
      properties:
        school:
          oneOf:
            - $ref: '#/components/schemas/School'
            - type: 'null'
        department:
          oneOf:
            - $ref: '#/components/schemas/Department'
            - type: 'null'
        level:
          type: [integer, 'null']
          minimum: 100
          maximum: 700
        examDate:
          type: [string, 'null']
          format: date
        onboardingComplete:
          type: boolean
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        schoolId:
          type: string
        departmentId:
          type: string
        referralCode:
          type: string
          minLength: 4
          maxLength: 12
          description: |
            Invite code from the link the student followed (`/r/<code>`). Accepted in the first 7 days
            after sign-up. When the student finishes their first session, both sides get 5 tokens.
        departmentName:
          type: string
          minLength: 2
          maxLength: 100
          description: |
            A department typed by the student when it is not in the list. It is added to the school's
            list, so the next student can pick it. Ignored when `departmentId` is sent.
        level:
          type: integer
          minimum: 100
          maximum: 700
        examDate:
          type: [string, 'null']
          format: date
    Course:
      type: object
      required: [id, code, title, schoolId]
      properties:
        id:
          type: string
        code:
          type: string
          description: Normalised, for example BIO102.
        title:
          type: [string, 'null']
        schoolId:
          type: string
    Enrolment:
      type: object
      required: [course, fileCount, mastery]
      properties:
        course:
          $ref: '#/components/schemas/Course'
        fileCount:
          type: integer
          minimum: 0
        mastery:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
    CourseDetail:
      type: object
      required: [course, files, topics, examDate]
      properties:
        course:
          $ref: '#/components/schemas/Course'
        files:
          type: array
          items:
            $ref: '#/components/schemas/StoredFile'
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicMastery'
        examDate:
          type: [string, 'null']
          format: date

    GuestSession:
      type: object
      required: [guestToken, expiresAt, questionsLeft]
      properties:
        guestToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        questionsLeft:
          type: integer
          minimum: 0
          maximum: 3

    BotEvent:
      type: object
      required: [eventId, provider, providerUserId, type, occurredAt]
      properties:
        eventId:
          type: string
          format: uuid
        provider:
          type: string
          enum: [telegram, whatsapp]
        providerUserId:
          type: string
        type:
          type: string
          description: |
            `ask_question` and `prep_answer` each count as one item toward the 3-item study day.
            `prep_session_finished` counts as a finished session when `questionCount` is at least
            2 and `answeredCount` equals it.
          enum: [ask_question, prep_answer, prep_session_finished]
        questionCount:
          type: integer
          minimum: 1
          description: Required for `prep_session_finished`.
        answeredCount:
          type: integer
          minimum: 0
          description: Required for `prep_session_finished`.
        occurredAt:
          type: string
          format: date-time
          description: Counts for the Lagos day it happened if it arrives within 48 hours.
      if:
        properties:
          type:
            const: prep_session_finished
      then:
        required: [questionCount, answeredCount]
    BotEventResult:
      type: object
      required: [accepted, streak]
      properties:
        accepted:
          type: boolean
          description: False when this `eventId` was already recorded.
        streak:
          $ref: '#/components/schemas/StreakSummary'
        streakReward:
          type: object
          description: Present when this event earned the 7 day reward.
          required: [tokens]
          properties:
            tokens:
              type: integer
              examples: [10]
