# fly.toml app configuration file generated for flo-app on 2026-11-12T21:15:05Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = "flo-app"
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[build.args]
  VITE_GOOGLE_CLIENT_ID = "190488316230-n3mb7lph9t77kmeug2ji3dhm66ph84s7.apps.googleusercontent.com"

[deploy]
  release_command = 'node dist/src/db/migrate-cli.js'
  strategy = 'bluegreen'

[env]
  PORT = "3000"
  NODE_ENV = "production"
  MAIL_DRIVER = "disabled"
  DB_POOL_MAX = "5"
  WEB_ORIGIN = "https://flo-app.fly.dev"
  APP_URL = "https://flo-app.fly.dev"
  PUBLIC_API_URL = "https://flo-app.fly.dev"
  TELEGRAM_BOT_USERNAME = "FlorenceAIBot"
  WHATSAPP_BUSINESS_NUMBER = "2347066975729"
  STORAGE_BUCKET = "materials"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '20s', interval = '15s', method = 'GET', path = '/v1/health', timeout = '5s' }]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
